<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>Graphic Design Training Diary</title>
<style>
:root{--primary:#0f766e;--primary2:#115e59;--bg:#f3f7f7;--card:#fff;--text:#183331;--muted:#6b7d7b;--line:#dce7e5;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Bengali","Segoe UI",Arial,sans-serif;font-size:15px}
header{background:linear-gradient(120deg,var(--primary2),var(--primary));color:white;padding:22px max(18px,calc((100% - 1100px)/2))}
header h1{font-size:23px;font-weight:600;margin:0 0 5px}header p{margin:0;color:#d7f4ef;font-size:13px}
main{max-width:1100px;margin:22px auto;padding:0 16px 40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat,.panel,.entry{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 12px #1232}
.stat{padding:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:4px;font-weight:600}
.layout{display:grid;grid-template-columns: minmax(280px, .85fr) minmax(0,1.5fr);gap:16px;align-items:start}
.panel{padding:18px}.panel h2{font-size:18px;margin:0 0 15px;font-weight:600}
label{display:block;font-size:13px;color:#405654;margin:12px 0 6px}
input,textarea,select{width:100%;border:1px solid #cbd9d7;border-radius:8px;padding:10px 11px;font:inherit;background:#fff;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #0f766e18}
textarea{min-height:90px;resize:vertical}.details{min-height:135px}
button{border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;background:var(--primary);color:white}
button:hover{background:var(--primary2)}button.secondary{background:#e8f2f0;color:#24534e}button.danger{background:#fff0ee;color:var(--danger)}button.small{padding:7px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.form-actions button:first-child{flex:1}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{flex:1;min-width:140px}.toolbar select{width:auto;min-width:130px}
.entry{padding:15px;margin-bottom:11px}.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry h3{margin:0 0 5px;font-size:16px;font-weight:600}.date{font-size:12px;color:var(--primary);font-weight:600}
.entry p{white-space:pre-wrap;line-height:1.55;margin:9px 0 0;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:7px}
.entry-actions{display:flex;gap:6px;flex-shrink:0}.empty{text-align:center;color:var(--muted);padding:35px 12px;border:1px dashed #cbd9d7;border-radius:12px}
.hidden{display:none!important}.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:11px}.stat strong{font-size:21px}header h1{font-size:20px}}
@media print{header{background:white;color:black;padding:10px 0}header p{color:#444}main{max-width:none;margin:0;padding:0}.stats,.form-panel,.toolbar,.entry-actions,.foot{display:none!important}.layout{display:block}.panel{border:0;box-shadow:none;padding:0}.entry{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header><h1>Graphic Design Training Diary</h1><p>গ্রাফিক ডিজাইন প্রশিক্ষণের প্রতিদিনের বিষয়, ক্লাস নোট ও প্র্যাকটিস সংরক্ষণ করুন</p></header>
<main>
  <section class="stats">
    <div class="stat"><small>মোট ক্লাস</small><strong id="totalCount">০</strong></div>
    <div class="stat"><small>এই মাসে</small><strong id="monthCount">০</strong></div>
    <div class="stat"><small>সর্বশেষ ক্লাস</small><strong id="latestDate">—</strong></div>
  </section>
  <div class="layout">
    <section class="panel form-panel">
      <h2 id="formTitle">নতুন ক্লাসের তথ্য যোগ করুন</h2>
      <form id="entryForm">
        <input type="hidden" id="editId">
        <label for="date">তারিখ *</label><input id="date" type="date" required>
        <label for="topic">আজকের টপিক / বিষয় *</label><input id="topic" type="text" placeholder="যেমন: Photoshop - Selection Tool" required>
        <label for="software">সফটওয়্যার / টুল</label><input id="software" type="text" placeholder="যেমন: Adobe Photoshop">
        <label for="details">বিস্তারিত আলোচনা / ক্লাস নোট *</label><textarea id="details" class="details" placeholder="আজ কী শিখলেন, কোন ধাপে কাজ করলেন, গুরুত্বপূর্ণ শর্টকাট..." required></textarea>
        <label for="practice">প্র্যাকটিস / বাড়ির কাজ</label><textarea id="practice" placeholder="কী অনুশীলন করতে হবে..."></textarea>
        <label for="extra">অতিরিক্ত নোট</label><textarea id="extra" placeholder="সমস্যা, প্রশ্ন বা পরের ক্লাসে যা জানতে চান..."></textarea>
        <div class="actions form-actions"><button type="submit" id="saveBtn">তথ্য সংরক্ষণ করুন</button><button type="button" class="secondary" id="resetBtn">পরিষ্কার</button></div>
      </form>
    </section>
    <section class="panel">
      <h2>সংরক্ষিত ক্লাসসমূহ</h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="টপিক বা বিস্তারিত খুঁজুন...">
        <select id="monthFilter"><option value="">সব মাস</option></select>
        <button class="secondary small" id="printBtn" type="button">প্রিন্ট</button>
      </div>
      <div id="entries"></div>
      <div class="actions">
        <button class="secondary small" id="exportBtn" type="button">ব্যাকআপ ডাউনলোড</button>
        <button class="secondary small" id="importBtn" type="button">ব্যাকআপ ইমপোর্ট</button>
        <input type="file" id="importFile" accept=".json,application/json" class="hidden">
      </div>
      <p class="foot">আপনার তথ্য এই ডিভাইসের ব্রাউজারে সংরক্ষিত থাকবে। নিয়মিত ব্যাকআপ ডাউনলোড করে রাখুন।</p>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const KEY='gd_training_diary_v1';
let records=[];
try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}
const today=new Date();$('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const fmtDate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${bn(d)}-${bn(m)}-${bn(y)}`};
function persist(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function resetForm(){$('entryForm').reset();$('editId').value='';$('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');$('formTitle').textContent='নতুন ক্লাসের তথ্য যোগ করুন';$('saveBtn').textContent='তথ্য সংরক্ষণ করুন'}
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const id=$('editId').value||String(Date.now());const item={id,date:$('date').value,topic:$('topic').value.trim(),software:$('software').value.trim(),details:$('details').value.trim(),practice:$('practice').value.trim(),extra:$('extra').value.trim()};const i=records.findIndex(x=>x.id===id);if(i>=0)records[i]=item;else records.push(item);records.sort((a,b)=>b.date.localeCompare(a.date));persist();resetForm()});
$('resetBtn').onclick=resetForm;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const now=new Date(),month=now.toISOString().slice(0,7);
 $('totalCount').textContent=bn(records.length);
 $('monthCount').textContent=bn(records.filter(x=>x.date?.startsWith(month)).length);
 $('latestDate').textContent=records[0]?.date?fmtDate(records[0].date):'—';
 const months=[...new Set(records.map(x=>x.date?.slice(0,7)).filter(Boolean))].sort().reverse();
 const current=$('monthFilter').value;
 $('monthFilter').innerHTML='<option value="">সব মাস</option>'+months.map(m=>`<option value="${m}">${bn(m.slice(5,7))}/${bn(m.slice(0,4))}</option>`).join('');
 $('monthFilter').value=months.includes(current)?current:'';
 const q=$('search').value.trim().toLowerCase(),f=$('monthFilter').value;
 const shown=records.filter(x=>(!f||x.date.startsWith(f))&&(!q||[x.topic,x.software,x.details,x.practice,x.extra].join(' ').toLowerCase().includes(q)));
 $('entries').innerHTML=shown.length?shown.map(x=>`<article class="entry"><div class="entry-top"><div><div class="date">${fmtDate(x.date)}</div><h3>${esc(x.topic)}</h3></div><div class="entry-actions"><button class="secondary small" onclick="editEntry('${esc(x.id)}')">এডিট</button><button class="danger small" onclick="deleteEntry('${esc(x.id)}')">মুছুন</button></div></div>${x.software?`<div class="meta">সফটওয়্যার: ${esc(x.software)}</div>`:''}<p>${esc(x.details)}</p>${x.practice?`<p><b>প্র্যাকটিস:</b> ${esc(x.practice)}</p>`:''}${x.extra?`<p><b>অতিরিক্ত নোট:</b> ${esc(x.extra)}</p>`:''}</article>`).join(''):'<div class="empty">এখনো কোনো ক্লাসের তথ্য নেই। বাম পাশের ফর্ম থেকে প্রথম ক্লাসটি যোগ করুন।</div>';
}
window.editEntry=id=>{const x=records.find(r=>r.id===id);if(!x)return;$('editId').value=x.id;$('date').value=x.date;$('topic').value=x.topic;$('software').value=x.software||'';$('details').value=x.details;$('practice').value=x.practice||'';$('extra').value=x.extra||'';$('formTitle').textContent='ক্লাসের তথ্য পরিবর্তন করুন';$('saveBtn').textContent='পরিবর্তন সংরক্ষণ করুন';window.scrollTo({top:0,behavior:'smooth'})};
window.deleteEntry=id=>{const x=records.find(r=>r.id===id);if(x&&confirm('এই ক্লাসের তথ্য মুছে ফেলতে চান?')){records=records.filter(r=>r.id!==id);persist();if($('editId').value===id)resetForm()}};
$('search').addEventListener('input',render);$('monthFilter').addEventListener('change',render);$('printBtn').onclick=()=>window.print();
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Graphic_Design_Training_Backup.json';a.click();URL.revokeObjectURL(url)};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(x=>x.date&&x.topic&&x.details))throw Error();if(confirm('বর্তমান তথ্যের সঙ্গে ব্যাকআপের তথ্য যোগ করবেন?')){const ids=new Set(records.map(x=>x.id));data.forEach(x=>{if(!ids.has(x.id))records.push({...x,id:x.id||String(Date.now()+Math.random())})});records.sort((a,b)=>b.date.localeCompare(a.date));persist();alert('ব্যাকআপ ইমপোর্ট হয়েছে।')}}catch(err){alert('ফাইলটি সঠিক ব্যাকআপ JSON নয়।')}e.target.value=''};
render();
</script>
</body></html>
